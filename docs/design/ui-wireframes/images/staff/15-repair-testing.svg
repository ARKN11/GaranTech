ize="9" font-weight="400" fill="#20242a" text-anchor="start">Still no display</text><text x="1031" y="306" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#20242a" text-anchor="start">2026-11-15 16:20</text><rect x="460" y="314" width="764" height="24" rx="2" fill="none" stroke="#8d959e" stroke-width="1"/><text x="467" y="330" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#20242a" text-anchor="start">2</text><text x="517" y="330" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#20242a" text-anchor="start">PASSED</text><text x="617" y="330" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#20242a" text-anchor="start">Display and charging OK</text><text x="1031" y="330" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#20242a" text-anchor="start">2026-11-16 10:05</text><rect x="216" y="370" width="1008" height="76" rx="2" fill="#fbfcfd" stroke="#c9ced4" stroke-width="1" stroke-dasharray="4 3"/><text x="225" y="385" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start">BR-11 / BR-12</text><text x="225" y="399" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">FAILED -&gt; notes mandatory, status stays IN_REPAIR, add operations and retest.</text><text x="225" y="412" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">PASSED -&gt; system sets COMPLETED, writes StatusHistory and repairJob.completedAt.</text><text x="225" y="425" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">All previous test results are preserved.</text><rect x="16" y="478" width="1208" height="84" rx="2" fill="#fafbfc" stroke="#c9ced4" stroke-width="1" stroke-dasharray="4 3"/><text x="25" y="493" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start">UI STATES</text><text x="25" y="507" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Validation: FAILED without notes -&gt; error.</text><text x="25" y="520" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Error: no operation recorded -&gt; test save rejected.</text><text x="25" y="533" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Success: test stored; status updated only when PASSED.</text><text x="25" y="546" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Loading: save disabled while submitting.</text></svg>