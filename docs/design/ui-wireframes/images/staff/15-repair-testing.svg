<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" width="1240" height="860"><rect x="0" y="0" width="1240" height="860" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><rect x="0" y="0" width="1240" height="44" rx="0" fill="#f7f8fa" stroke="#c9ced4" stroke-width="1"/><line x1="1240" y1="44" x2="0" y2="44" stroke="#c9ced4" stroke-width="1"/><text x="1226" y="28" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#20242a" text-anchor="start" direction="rtl" unicode-bidi="embed">GaranTech</text><text x="1148" y="28" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">/ ثبت آزمون تعمیر</text><text x="14" y="28" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="end" direction="rtl" unicode-bidi="embed">P15</text><text x="1224" y="68" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">فقط TECHNICIAN. چند آزمون برای هر کار؛ FAILED وضعیت را IN_REPAIR نگه میدارد.</text><rect x="1050" y="44" width="190" height="816" rx="0" fill="#f1f3f5" stroke="#c9ced4" stroke-width="1"/><text x="1226" y="66" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">محیط کاری کارکنان</text><text x="1224" y="88" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">ورود</text><text x="1224" y="115" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">داشبورد</text><text x="1224" y="142" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">فهرست درخواست‌ها</text><text x="1224" y="169" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">جزئیات درخواست</text><text x="1224" y="196" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">دریافت دستگاه</text><text x="1224" y="223" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">کارشناسی و گارانتی</text><text x="1224" y="250" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">پیشنهاد هزینه</text><text x="1224" y="277" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">مدیریت تعمیر</text><rect x="1058" y="292" width="174" height="22" rx="2" fill="#e4e7eb" stroke="#c9ced4" stroke-width="1"/><text x="1224" y="304" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#20242a" text-anchor="start" direction="rtl" unicode-bidi="embed">آزمون تعمیر</text><text x="1224" y="331" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">مدیریت کارکنان</text><rect x="16" y="112" width="1008" height="70" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><rect x="16" y="112" width="1008" height="25" rx="2" fill="#f1f3f5" stroke="#8d959e" stroke-width="1"/><text x="1015" y="129" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#20242a" text-anchor="start" direction="rtl" unicode-bidi="embed">فرایند تعمیر - GT-DEMO-2048</text><text x="1010" y="146" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#20242a" text-anchor="start" direction="rtl" unicode-bidi="embed">وضعیت: IN_REPAIR   |   عملیات ثبتشده: ۲</text><text x="1010" y="168" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">تعمیرکار: TECHNICIAN واردشده (فقطخواندنی)</text><text x="1024" y="195" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">نتیجه آزمون *</text><rect x="704" y="202" width="320" height="30" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="1016" y="221" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start" direction="rtl" unicode-bidi="embed">PASSED / FAILED</text><text x="713" y="221" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#59616b" text-anchor="end" direction="rtl" unicode-bidi="embed">v</text><text x="680" y="195" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">توضیحات آزمون *</text><rect x="16" y="202" width="664" height="48" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="672" y="220" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start" direction="rtl" unicode-bidi="embed">در حالت FAILED الزامی است</text><rect x="804" y="270" width="220" height="36" rx="3" fill="#20242a" stroke="#20242a" stroke-width="1"/><text x="914.0" y="289" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" direction="rtl" unicode-bidi="embed">ثبت نتیجه آزمون</text><rect x="16" y="266" width="764" height="24" rx="2" fill="#f1f3f5" stroke="#8d959e" stroke-width="1"/><text x="773" y="282" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">#</text><text x="723" y="282" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">نتیجه</text><text x="623" y="282" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">توضیحات</text><text x="209" y="282" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">زمان آزمون</text><rect x="16" y="266" width="764" height="24" rx="2" fill="none" stroke="#8d959e" stroke-width="1"/><rect x="16" y="290" width="764" height="24" rx="2" fill="none" stroke="#8d959e" stroke-width="1"/><text x="773" y="306" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#20242a" text-anchor="start" direction="rtl" unicode-bidi="embed">1</text><text x="723" y="306" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#20242a" text-anchor="start" direction="rtl" unicode-bidi="embed">FAILED</text><text x="623" y="306" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#20242a" text-anchor="start" direction="rtl" unicode-bidi="embed">همچنان تصویری وجود ندارد</text><text x="209" y="306" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#20242a" text-anchor="start" direction="rtl" unicode-bidi="embed">2026-11-15 16:20</text><rect x="16" y="314" width="764" height="24" rx="2" fill="none" stroke="#8d959e" stroke-width="1"/><text x="773" y="330" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#20242a" text-anchor="start" direction="rtl" unicode-bidi="embed">2</text><text x="723" y="330" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#20242a" text-anchor="start" direction="rtl" unicode-bidi="embed">PASSED</text><text x="623" y="330" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#20242a" text-anchor="start" direction="rtl" unicode-bidi="embed">تصویر و شارژ سالماند</text><text x="209" y="330" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#20242a" text-anchor="start" direction="rtl" unicode-bidi="embed">2026-11-16 10:05</text><rect x="16" y="370" width="1008" height="76" rx="2" fill="#fbfcfd" stroke="#c9ced4" stroke-width="1" stroke-dasharray="4 3"/><text x="1015" y="385" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">BR-11 / BR-12</text><text x="1015" y="399" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">FAILED → توضیحات الزامی، وضعیت IN_REPAIR باقی میماند، عملیات بیشتر و آزمون مجدد.</text><text x="1015" y="412" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">PASSED → سامانه وضعیت را COMPLETED می کند، StatusHistory و repairJob.completedAt را ثبت می کند.</text><text x="1015" y="425" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">همه نتایج آزمون قبلی حفظ میشوند.</text><rect x="16" y="478" width="1208" height="84" rx="2" fill="#fafbfc" stroke="#c9ced4" stroke-width="1" stroke-dasharray="4 3"/><text x="1215" y="493" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">حالتهای رابط کاربری</text><text x="1215" y="507" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">- اعتبارسنجی: FAILED بدون توضیحات → خطا.</text><text x="1215" y="520" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">- خطا: عملیاتی ثبت نشده → ثبت آزمون رد می شود.</text><text x="1215" y="533" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">- موفقیت: آزمون ثبت شد؛ وضعیت فقط در حالت PASSED به روز می شود.</text><text x="1215" y="546" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">- بارگذاری: دکمه ثبت هنگام ارسال غیرفعال است.</text></svg>