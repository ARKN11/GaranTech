ma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start" direction="rtl" unicode-bidi="embed">مثلاً بدون تصویر</text><text x="690" y="295" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">ایراد ۱ - شرح</text><rect x="30" y="302" width="660" height="30" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="682" y="321" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start" direction="rtl" unicode-bidi="embed">شرح ایراد تشخیصدادهشده</text><text x="1010" y="337" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">ایراد ۲ - عنوان (اختیاری)</text><rect x="710" y="344" width="300" height="30" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="1002" y="363" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start" direction="rtl" unicode-bidi="embed">مثلاً مشکل باتری</text><text x="690" y="337" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">ایراد ۲ - شرح (اختیاری)</text><rect x="30" y="344" width="660" height="30" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="682" y="363" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start" direction="rtl" unicode-bidi="embed">شرح ایراد</text><rect x="864" y="430" width="160" height="30" rx="3" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="944.0" y="449" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#20242a" text-anchor="middle" direction="rtl" unicode-bidi="embed">+ افزودن ایراد</text><text x="840" y="423" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">اقدام پیشنهادی *</text><rect x="520" y="430" width="320" height="30" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="832" y="449" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start" direction="rtl" unicode-bidi="embed">REPAIR / DEVICE_REPLACEMENT</text><text x="529" y="449" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#59616b" text-anchor="end" direction="rtl" unicode-bidi="embed">v</text><text x="496" y="417" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">یادداشت کارشناسی (اختیاری)</text><rect x="16" y="424" width="480" height="48" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="488" y="442" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start" direction="rtl" unicode-bidi="embed">اختیاری</text><rect x="804" y="494" width="220" height="36" rx="3" fill="#20242a" stroke="#20242a" stroke-width="1"/><text x="914.0" y="513" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" direction="rtl" unicode-bidi="embed">ثبت نتیجه کارشناسی</text><rect x="16" y="490" width="764" height="64" rx="2" fill="#fbfcfd" stroke="#c9ced4" stroke-width="1" stroke-dasharray="4 3"/><text x="771" y="505" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">دو مسیر الزامی</text><text x="771" y="519" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">ELIGIBLE → مستقیماً READY_FOR_REPAIR؛ بدون پیشنهاد و تصمیم مشتری.</text><text x="771" y="532" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">NOT_ELIGIBLE → INSPECTED؛ سپس ثبت پیشنهاد (P13).</text><rect x="16" y="580" width="1208" height="84" rx="2" fill="#fafbfc" stroke="#c9ced4" stroke-width="1" stroke-dasharray="4 3"/><text x="1215" y="595" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">حالتهای رابط کاربری</text><text x="1215" y="609" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">- اعتبارسنجی: نبود ایراد / خالی بودن دلیل برای NOT_ELIGIBLE → خطا.</text><text x="1215" y="622" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">- خطا: وضعیت RECEIVED نیست → ثبت رد می شود.</text><text x="1215" y="635" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">- موفقیت: کارشناسی و ایرادها ثبت و وضعیت به روز می شود.</text><text x="1215" y="648" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">- بارگذاری: دکمه ثبت هنگام ارسال غیرفعال است.</text></svg>