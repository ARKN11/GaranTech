<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" width="1240" height="860"><rect x="0" y="0" width="1240" height="860" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><rect x="0" y="0" width="1240" height="44" rx="0" fill="#f7f8fa" stroke="#c9ced4" stroke-width="1"/><line x1="0" y1="44" x2="1240" y2="44" stroke="#c9ced4" stroke-width="1"/><text x="14" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#20242a" text-anchor="start">GaranTech</text><text x="92" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#59616b" text-anchor="start">/ Inspection &amp; Warranty</text><text x="1226" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="end">P12</text><text x="16" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start">SERVICE_EXPERT only. Warranty is entered manually, never calculated.</text><rect x="0" y="44" width="190" height="816" rx="0" fill="#f1f3f5" stroke="#c9ced4" stroke-width="1"/><text x="14" y="66" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start">STAFF WORKSPACE</text><text x="16" y="88" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">Login</text><text x="16" y="115" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">Dashboard</text><text x="16" y="142" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">Requests List</text><text x="16" y="169" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">Request Details</text><text x="16" y="196" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">Device Reception</text><rect x="8" y="211" width="174" height="22" rx="2" fill="#e4e7eb" stroke="#c9ced4" stroke-width="1"/><text x="16" y="223" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#20242a" text-anchor="start">Inspection &amp; Warranty</text><text x="16" y="250" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">Repair Proposal</text><text x="16" y="277" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">Repair Management</text><text x="16" y="304" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">Repair Testing</text><text x="16" y="331" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">Staff Management</text><rect x="216" y="112" width="1008" height="62" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="230" y="144" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start">Request</text><text x="1210" y="144" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#20242a" text-anchor="end">GT-DEMO-2048   |   RECEIVED   |   reception confirmed</text><text x="216" y="189" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start">Warranty result *</text><rect x="216" y="196" width="300" height="30" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="224" y="215" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start">ELIGIBLE / NOT_ELIGIBLE</text><text x="507" y="215" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#59616b" text-anchor="end">v</text><text x="540" y="189" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start">Warranty rejection reason *</text><rect x="540" y="196" width="684" height="48" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="548" y="214" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start">Required when NOT_ELIGIBLE</text><rect x="216" y="268" width="1008" height="148" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><rect x="216" y="268" width="1008" height="25" rx="2" fill="#f1f3f5" stroke="#8d959e" stroke-width="1"/><text x="225" y="285" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#20242a" text-anchor="start">Diagnosed Defects (1..N)</text><text x="230" y="295" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start">Defect 1 - title</text><rect x="230" y="302" width="300" height="30" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="238" y="321" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start">e.g. No display</text><text x="550" y="295" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start">Defect 1 - description</text><rect x="550" y="302" width="660" height="30" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="558" y="321" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start">Describe the diagnosed fault</text><text x="230" y="337" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start">Defect 2 - title (optional)</text><rect x="230" y="344" width="300" height="30" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="238" y="363" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start">e.g. Battery issue</text><text x="550" y="337" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start">Defect 2 - description (optional)</text><rect x="550" y="344" width="660" height="30" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="558" y="363" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start">Describe the fault</text><rect x="216" y="430" width="160" height="30" rx="3" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="296.0" y="449" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#20242a" text-anchor="middle">+ Add Defect</text><text x="400" y="423" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start">Recommended action *</text><rect x="400" y="430" width="320" height="30" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="408" y="449" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start">REPAIR / DEVICE_REPLACEMENT</text><text x="711" y="449" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#59616b" text-anchor="end">v</text><text x="744" y="417" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start">Inspection notes (optional)</text><rect x="744" y="424" width="480" height="48" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="752" y="442" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start">Optional</text><rect x="216" y="494" width="220" height="36" rx="3" fill="#20242a" stroke="#20242a" stroke-width="1"/><text x="326.0" y="513" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Save Inspection</text><rect x="460" y="490" width="764" height="64" rx="2" fill="#fbfcfd" stroke="#c9ced4" stroke-width="1" stroke-dasharray="4 3"/><text x="469" y="505" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start">TWO REQUIRED PATHS</text><text x="469" y="519" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">ELIGIBLE -&gt; READY_FOR_REPAIR directly; no proposal, no customer decision.</text><text x="469" y="532" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">NOT_ELIGIBLE -&gt; INSPECTED; create proposal next (P13).</text><rect x="16" y="580" width="1208" height="84" rx="2" fill="#fafbfc" stroke="#c9ced4" stroke-width="1" stroke-dasharray="4 3"/><text x="25" y="595" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start">UI STATES</text><text x="25" y="609" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Validation: no defect / empty reason for NOT_ELIGIBLE -&gt; error.</text><text x="25" y="622" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Error: status not RECEIVED -&gt; save rejected.</text><text x="25" y="635" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Success: inspection + defects saved, status updated.</text><text x="25" y="648" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Loading: save disabled while submitting.</text></svg>