<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" width="1240" height="860"><rect x="0" y="0" width="1240" height="860" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><rect x="0" y="0" width="1240" height="44" rx="0" fill="#f7f8fa" stroke="#c9ced4" stroke-width="1"/><line x1="0" y1="44" x2="1240" y2="44" stroke="#c9ced4" stroke-width="1"/><text x="14" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#20242a" text-anchor="start">GaranTech</text><text x="92" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#59616b" text-anchor="start">/ Repair Proposal</text><text x="1226" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="end">P13</text><text x="16" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start">Only for NOT_ELIGIBLE inspections. One total amount; no line items.</text><rect x="0" y="44" width="190" height="816" rx="0" fill="#f1f3f5" stroke="#c9ced4" stroke-width="1"/><text x="14" y="66" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start">STAFF WORKSPACE</text><text x="16" y="88" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">Login</text><text x="16" y="115" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">Dashboard</text><text x="16" y="142" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">Requests List</text><text x="16" y="169" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">Request Details</text><text x="16" y="196" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">Device Reception</text><text x="16" y="223" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">Inspection &amp; Warranty</text><rect x="8" y="238" width="174" height="22" rx="2" fill="#e4e7eb" stroke="#c9ced4" stroke-width="1"/><text x="16" y="250" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#20242a" text-anchor="start">Repair Proposal</text><text x="16" y="277" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">Repair Management</text><text x="16" y="304" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">Repair Testing</text><text x="16" y="331" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">Staff Management</text><rect x="216" y="112" width="1008" height="80" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><rect x="216" y="112" width="1008" height="25" rx="2" fill="#f1f3f5" stroke="#8d959e" stroke-width="1"/><text x="225" y="129" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#20242a" text-anchor="start">Inspection Summary</text><text x="230" y="146" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#20242a" text-anchor="start">Warranty: NOT_ELIGIBLE   |   Reason: warranty period expired</text><text x="230" y="170" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start">Recommended action: REPAIR   |   Defects: 2 recorded</text><text x="216" y="205" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start">Estimated Total Cost (IRR) *</text><rect x="216" y="212" width="320" height="30" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="224" y="231" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start">8,500,000</text><text x="560" y="205" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start">Proposal notes (optional)</text><rect x="560" y="212" width="664" height="48" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="568" y="230" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start">Shown to customer</text><rect x="216" y="284" width="1008" height="108" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><rect x="216" y="284" width="1008" height="25" rx="2" fill="#f1f3f5" stroke="#8d959e" stroke-width="1"/><text x="225" y="301" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#20242a" text-anchor="start">Customer Preview (allowlisted fields)</text><text x="230" y="318" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start">Warranty result</text><text x="1210" y="318" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#20242a" text-anchor="end">NOT_ELIGIBLE</text><text x="230" y="344" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start">Estimated total</text><text x="1210" y="344" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#20242a" text-anchor="end">8,500,000 IRR</text><text x="230" y="372" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start">Notes: screen replacement and diagnostics.</text><rect x="216" y="412" width="240" height="36" rx="3" fill="#20242a" stroke="#20242a" stroke-width="1"/><text x="336.0" y="431" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Save Proposal</text><rect x="480" y="408" width="744" height="66" rx="2" fill="#fbfcfd" stroke="#c9ced4" stroke-width="1" stroke-dasharray="4 3"/><text x="489" y="423" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start">RULES / SUCCESS</text><text x="489" y="437" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">Blocked unless warranty = NOT_ELIGIBLE and status = INSPECTED.</text><text x="489" y="450" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">Amount must be numeric and greater than zero (IC-15).</text><text x="489" y="463" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">On save: AWAITING_CUSTOMER_DECISION + StatusHistory row.</text><rect x="16" y="500" width="1208" height="84" rx="2" fill="#fafbfc" stroke="#c9ced4" stroke-width="1" stroke-dasharray="4 3"/><text x="25" y="515" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start">UI STATES</text><text x="25" y="529" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Validation: zero, negative or non-numeric amount -&gt; error.</text><text x="25" y="542" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Error: eligible request -&gt; proposal action unavailable.</text><text x="25" y="555" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Success: proposal saved; customer can decide after verification.</text><text x="25" y="568" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Loading: save disabled while submitting.</text></svg>