<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" width="1240" height="860"><rect x="0" y="0" width="1240" height="860" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><rect x="0" y="0" width="1240" height="44" rx="0" fill="#f7f8fa" stroke="#c9ced4" stroke-width="1"/><line x1="1240" y1="44" x2="0" y2="44" stroke="#c9ced4" stroke-width="1"/><text x="1226" y="28" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#20242a" text-anchor="start" direction="rtl" unicode-bidi="embed">GaranTech</text><text x="1148" y="28" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">/ پیشنهاد هزینه تعمیر</text><text x="14" y="28" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="end" direction="rtl" unicode-bidi="embed">P13</text><text x="1224" y="68" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">فقط برای کارشناسی NOT_ELIGIBLE. یک مبلغ کل؛ بدون ریزاقلام.</text><rect x="1050" y="44" width="190" height="816" rx="0" fill="#f1f3f5" stroke="#c9ced4" stroke-width="1"/><text x="1226" y="66" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">محیط کاری کارکنان</text><text x="1224" y="88" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">ورود</text><text x="1224" y="115" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">داشبورد</text><text x="1224" y="142" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">فهرست درخواست‌ها</text><text x="1224" y="169" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">جزئیات درخواست</text><text x="1224" y="196" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">دریافت دستگاه</text><text x="1224" y="223" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">کارشناسی و گارانتی</text><rect x="1058" y="238" width="174" height="22" rx="2" fill="#e4e7eb" stroke="#c9ced4" stroke-width="1"/><text x="1224" y="250" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#20242a" text-anchor="start" direction="rtl" unicode-bidi="embed">پیشنهاد هزینه</text><text x="1224" y="277" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">مدیریت تعمیر</text><text x="1224" y="304" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">آزمون تعمیر</text><text x="1224" y="331" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">مدیریت کارکنان</text><rect x="16" y="112" width="1008" height="80" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><rect x="16" y="112" width="1008" height="25" rx="2" fill="#f1f3f5" stroke="#8d959e" stroke-width="1"/><text x="1015" y="129" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#20242a" text-anchor="start" direction="rtl" unicode-bidi="embed">خلاصه کارشناسی</text><text x="1010" y="146" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#20242a" text-anchor="start" direction="rtl" unicode-bidi="embed">گارانتی: NOT_ELIGIBLE   |   دلیل: پایان دوره گارانتی</text><text x="1010" y="170" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">اقدام پیشنهادی: REPAIR   |   ایرادها: ۲ رکورد</text><text x="1024" y="205" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">هزینه کل پیشنهادی (ریال) *</text><rect x="704" y="212" width="320" height="30" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="1016" y="231" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start" direction="rtl" unicode-bidi="embed">8,500,000</text><text x="680" y="205" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">توضیحات پیشنهاد (اختیاری)</text><rect x="16" y="212" width="664" height="48" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="672" y="230" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start" direction="rtl" unicode-bidi="embed">قابل نمایش برای مشتری</text><rect x="16" y="284" width="1008" height="108" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><rect x="16" y="284" width="1008" height="25" rx="2" fill="#f1f3f5" stroke="#8d959e" stroke-width="1"/><text x="1015" y="301" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#20242a" text-anchor="start" direction="rtl" unicode-bidi="embed">پیشنمایش برای مشتری (فیلدهای مجاز)</text><text x="1010" y="318" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">وضعیت گارانتی</text><text x="30" y="318" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#20242a" text-anchor="end" direction="rtl" unicode-bidi="embed">NOT_ELIGIBLE</text><text x="1010" y="344" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">مبلغ کل</text><text x="30" y="344" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#20242a" text-anchor="end" direction="rtl" unicode-bidi="embed">۸٬۵۰۰٬۰۰۰ ریال</text><text x="1010" y="372" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">توضیحات: تعویض صفحه نمایش و عیبیابی.</text><rect x="784" y="412" width="240" height="36" rx="3" fill="#20242a" stroke="#20242a" stroke-width="1"/><text x="904.0" y="431" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" direction="rtl" unicode-bidi="embed">ثبت پیشنهاد</text><rect x="16" y="408" width="744" height="66" rx="2" fill="#fbfcfd" stroke="#c9ced4" stroke-width="1" stroke-dasharray="4 3"/><text x="751" y="423" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">قواعد / موفقیت</text><text x="751" y="437" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">مسدود مگر اینکه گارانتی = NOT_ELIGIBLE و وضعیت = INSPECTED باشد.</text><text x="751" y="450" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">مبلغ باید عددی و بزرگتر از صفر باشد (IC-15).</text><text x="751" y="463" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">پس از ثبت: AWAITING_CUSTOMER_DECISION + رکورد StatusHistory.</text><rect x="16" y="500" width="1208" height="84" rx="2" fill="#fafbfc" stroke="#c9ced4" stroke-width="1" stroke-dasharray="4 3"/><text x="1215" y="515" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">حالتهای رابط کاربری</text><text x="1215" y="529" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">- اعتبارسنجی: مبلغ صفر، منفی یا غیرعددی → خطا.</text><text x="1215" y="542" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">- خطا: درخواست واجد شرایط گارانتی → ثبت پیشنهاد در دسترس نیست.</text><text x="1215" y="555" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">- موفقیت: پیشنهاد ثبت شد؛ مشتری پس از احراز میتواند تصمیم بگیرد.</text><text x="1215" y="568" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">- بارگذاری: دکمه ثبت هنگام ارسال غیرفعال است.</text></svg>