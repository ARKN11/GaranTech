"Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start">ROLE VISIBILITY</text><text x="225" y="347" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">SERVICE_EXPERT: reception, inspection, proposal.   TECHNICIAN: repair jobs and tests.</text><text x="225" y="360" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">ADMIN: request monitoring with status filter + staff management.</text><text x="225" y="373" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">Counts are navigation aids only. No charts, reports or KPI analytics in this scope.</text><rect x="16" y="450" width="1208" height="84" rx="2" fill="#fafbfc" stroke="#c9ced4" stroke-width="1" stroke-dasharray="4 3"/><text x="25" y="465" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start">UI STATES</text><text x="25" y="479" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Empty: no requests -&gt; &#x27;No requests&#x27; message in each list.</text><text x="25" y="492" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Loading: skeletons in count cards and table.</text><text x="25" y="505" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Error: load failed -&gt; retry message.</text><text x="25" y="518" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Role: widgets and actions filtered by role in the backend.</text></svg>