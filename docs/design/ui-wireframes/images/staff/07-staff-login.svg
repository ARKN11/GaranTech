="1" stroke-dasharray="4 3"/><text x="1215" y="435" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">حالتهای رابط کاربری</text><text x="1215" y="449" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">- اولیه: فرم خالی و دکمه ورود فعال.</text><text x="1215" y="462" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">- اعتبارسنجی: خالی بودن نام کاربری/رمز → خطای درون فرم.</text><text x="1215" y="475" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">- خطا: اطلاعات نامعتبر → پیام خطای عمومی.</text><text x="1215" y="488" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">- موفقیت: داشبورد متناسب نقش، نه داشبورد مشترک.</text></svg>