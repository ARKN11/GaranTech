oke-width="1" stroke-dasharray="4 3"/><text x="225" y="435" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start">SCOPE / SECURITY</text><text x="225" y="449" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">Only ADMIN can access this page; backend enforces the permission.</text><text x="225" y="462" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">Backend stores password_hash only - never the raw password.</text><text x="225" y="475" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">No reporting, finance, inventory or external integration in scope.</text><rect x="16" y="518" width="1208" height="84" rx="2" fill="#fafbfc" stroke="#c9ced4" stroke-width="1" stroke-dasharray="4 3"/><text x="25" y="533" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start">UI STATES</text><text x="25" y="547" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Validation: duplicate username or missing field -&gt; error.</text><text x="25" y="560" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Error: action outside admin authority -&gt; rejected.</text><text x="25" y="573" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Success: account appears in the list with ACTIVE state.</text><text x="25" y="586" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Loading: create and role actions disabled while saving.</text></svg>