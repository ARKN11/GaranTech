<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 660" width="420" height="660"><rect x="0" y="0" width="420" height="660" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><rect x="0" y="0" width="420" height="44" rx="0" fill="#f7f8fa" stroke="#c9ced4" stroke-width="1"/><line x1="0" y1="44" x2="420" y2="44" stroke="#c9ced4" stroke-width="1"/><text x="14" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#20242a" text-anchor="start">GaranTech</text><text x="92" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#59616b" text-anchor="start">/ Home</text><text x="406" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="end">P01</text><text x="16" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start">Public page - no customer account or login</text><rect x="16" y="92" width="388" height="96" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="32" y="126" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#20242a" text-anchor="start">GaranTech</text><text x="32" y="150" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#59616b" text-anchor="start">Warranty &amp; repair requests</text><text x="32" y="168" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#59616b" text-anchor="start">for mobile phones and laptops</text><rect x="16" y="208" width="388" height="42" rx="3" fill="#20242a" stroke="#20242a" stroke-width="1"/><text x="210.0" y="227" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Submit Repair Request</text><rect x="16" y="260" width="388" height="42" rx="3" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="210.0" y="279" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#20242a" text-anchor="middle">Track Request</text><text x="16" y="336" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#59616b" text-anchor="start">HOW IT WORKS</text><rect x="16" y="350" width="388" height="34" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="28" y="372" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#20242a" text-anchor="start">1   Register online - receive a tracking code</text><rect x="16" y="390" width="388" height="34" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="28" y="412" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#20242a" text-anchor="start">2   Hand the device in at the service point</text><rect x="16" y="430" width="388" height="34" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="28" y="452" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#20242a" text-anchor="start">3   Inspection and warranty decision</text><rect x="16" y="470" width="388" height="34" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="28" y="492" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#20242a" text-anchor="start">4   Repair, final test and status tracking</text><rect x="16" y="526" width="388" height="70" rx="2" fill="#fafbfc" stroke="#c9ced4" stroke-width="1" stroke-dasharray="4 3"/><text x="25" y="541" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start">UI STATES</text><text x="25" y="555" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Initial: no saved state; both CTAs always available.</text><text x="25" y="568" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Validation: field-level errors on the submit form.</text><text x="25" y="581" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Success: tracking code shown after registration.</text></svg>