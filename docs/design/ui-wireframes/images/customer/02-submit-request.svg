/><text x="25" y="675" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start">UI STATES</text><text x="25" y="689" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Validation: required fields empty / invalid phone -&gt; inline error.</text><text x="25" y="702" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Error: out-of-scope category -&gt; &#x27;Out of system scope&#x27;, no record.</text><text x="25" y="715" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Success: REGISTERED + generated tracking code.</text><text x="25" y="728" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Loading: submit button disabled while request is in flight.</text></svg>