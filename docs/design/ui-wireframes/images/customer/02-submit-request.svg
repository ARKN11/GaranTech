de-bidi="embed">نام و نام خانوادگی</text><text x="392" y="159" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">شماره تلفن *</text><rect x="28" y="166" width="364" height="30" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="384" y="185" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start" direction="rtl" unicode-bidi="embed">09xxxxxxxxx</text><rect x="16" y="222" width="388" height="190" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><rect x="16" y="222" width="388" height="25" rx="2" fill="#f1f3f5" stroke="#8d959e" stroke-width="1"/><text x="395" y="239" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#20242a" text-anchor="start" direction="rtl" unicode-bidi="embed">دستگاه</text><text x="392" y="249" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">نوع دستگاه *</text><rect x="28" y="256" width="364" height="30" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="384" y="275" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start" direction="rtl" unicode-bidi="embed">MOBILE / LAPTOP</text><text x="37" y="275" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#59616b" text-anchor="end" direction="rtl" unicode-bidi="embed">v</text><text x="392" y="289" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">برند (اختیاری)</text><rect x="28" y="296" width="364" height="30" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="384" y="315" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start" direction="rtl" unicode-bidi="embed">مثلاً Samsung</text><text x="392" y="329" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">مدل *</text><rect x="28" y="336" width="364" height="30" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="384" y="355" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start" direction="rtl" unicode-bidi="embed">مدل دستگاه</text><text x="392" y="369" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">شماره سریال (اختیاری)</text><rect x="28" y="376" width="364" height="30" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="384" y="395" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start" direction="rtl" unicode-bidi="embed">در صورت وجود</text><rect x="16" y="424" width="388" height="100" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><rect x="16" y="424" width="388" height="25" rx="2" fill="#f1f3f5" stroke="#8d959e" stroke-width="1"/><text x="395" y="441" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#20242a" text-anchor="start" direction="rtl" unicode-bidi="embed">مشکل</text><text x="392" y="451" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">شرح اولیه مشکل *</text><rect x="28" y="458" width="364" height="54" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="384" y="476" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start" direction="rtl" unicode-bidi="embed">مشکل دستگاه را شرح دهید...</text><rect x="16" y="538" width="388" height="48" rx="2" fill="#fbfcfd" stroke="#c9ced4" stroke-width="1" stroke-dasharray="4 3"/><text x="395" y="553" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">BR-02</text><text x="395" y="567" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">ثبت آنلاین جایگزین تحویل حضوری دستگاه نیست.</text><text x="395" y="580" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">تا ثبت دریافت، وضعیت REGISTERED باقی میماند.</text><rect x="16" y="600" width="388" height="40" rx="3" fill="#20242a" stroke="#20242a" stroke-width="1"/><text x="210.0" y="619" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" direction="rtl" unicode-bidi="embed">ثبت درخواست و نمایش کد رهگیری</text><rect x="16" y="660" width="388" height="84" rx="2" fill="#fafbfc" stroke="#c9ced4" stroke-width="1" stroke-dasharray="4 3"/><text x="395" y="675" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">حالتهای رابط کاربری</text><text x="395" y="689" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">- اعتبارسنجی: فیلد اجباری خالی یا شماره نامعتبر → خطای درون فرم.</text><text x="395" y="702" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">- خطا: دستگاه خارج از محدوده → پیام «خارج از محدوده سامانه» و عدم ثبت درخواست.</text><text x="395" y="715" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">- موفقیت: REGISTERED + کد رهگیری تولیدشده.</text><text x="395" y="728" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">- بارگذاری: دکمه ثبت هنگام ارسال غیرفعال است.</text></svg>