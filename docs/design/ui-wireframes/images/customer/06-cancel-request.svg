<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 600" width="420" height="600"><rect x="0" y="0" width="420" height="600" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><rect x="0" y="0" width="420" height="44" rx="0" fill="#f7f8fa" stroke="#c9ced4" stroke-width="1"/><line x1="0" y1="44" x2="420" y2="44" stroke="#c9ced4" stroke-width="1"/><text x="14" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#20242a" text-anchor="start">GaranTech</text><text x="92" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#59616b" text-anchor="start">/ Cancel Request</text><text x="406" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="end">P06</text><text x="16" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start">Allowed before IN_REPAIR only - BR-07</text><rect x="16" y="92" width="388" height="88" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><rect x="16" y="92" width="388" height="25" rx="2" fill="#f1f3f5" stroke="#8d959e" stroke-width="1"/><text x="25" y="109" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#20242a" text-anchor="start">Request</text><text x="28" y="122" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start">Tracking code</text><text x="392" y="122" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#20242a" text-anchor="end">GT-DEMO-2048</text><text x="28" y="148" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start">Current status</text><text x="392" y="148" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#20242a" text-anchor="end">READY_FOR_REPAIR</text><text x="16" y="189" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start">Reason for cancellation (optional)</text><rect x="16" y="196" width="388" height="56" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="24" y="214" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start">Optional</text><rect x="16" y="270" width="388" height="104" rx="2" fill="#fbfcfd" stroke="#c9ced4" stroke-width="1" stroke-dasharray="4 3"/><text x="25" y="285" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start">CONFIRMATION DIALOG</text><text x="25" y="299" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">CONFIRM CANCELLATION?</text><text x="25" y="312" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">This cannot be undone.</text><text x="25" y="325" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">[ Confirm cancellation ]   [ Keep request ]</text><text x="25" y="338" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">Decline returns to Request Details with no change.</text><rect x="16" y="390" width="388" height="48" rx="2" fill="#fbfcfd" stroke="#c9ced4" stroke-width="1" stroke-dasharray="4 3"/><text x="25" y="405" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start">BLOCKED STATE</text><text x="25" y="419" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">IN_REPAIR / COMPLETED / CANCELLED -&gt; action disabled</text><text x="25" y="432" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">with message: &#x27;Cancellation is no longer possible&#x27;.</text><rect x="16" y="452" width="388" height="70" rx="2" fill="#fafbfc" stroke="#c9ced4" stroke-width="1" stroke-dasharray="4 3"/><text x="25" y="467" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start">UI STATES</text><text x="25" y="481" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Empty: reason optional.</text><text x="25" y="494" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Error: cancel after repair started -&gt; rejected.</text><text x="25" y="507" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Success: CANCELLED + cancelled_at recorded.</text></svg>