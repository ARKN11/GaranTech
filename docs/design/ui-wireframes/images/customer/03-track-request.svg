<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 590" width="420" height="590"><rect x="0" y="0" width="420" height="590" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><rect x="0" y="0" width="420" height="44" rx="0" fill="#f7f8fa" stroke="#c9ced4" stroke-width="1"/><line x1="420" y1="44" x2="0" y2="44" stroke="#c9ced4" stroke-width="1"/><text x="406" y="28" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#20242a" text-anchor="start" direction="rtl" unicode-bidi="embed">GaranTech</text><text x="328" y="28" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">/ پیگیری درخواست</text><text x="14" y="28" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="end" direction="rtl" unicode-bidi="embed">P03</text><text x="404" y="68" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">هر دو مقدار الزامیاند. بدون ورود.</text><rect x="16" y="92" width="388" height="124" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><rect x="16" y="92" width="388" height="25" rx="2" fill="#f1f3f5" stroke="#8d959e" stroke-width="1"/><text x="395" y="109" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#20242a" text-anchor="start" direction="rtl" unicode-bidi="embed">احراز درخواست</text><text x="392" y="119" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">کد رهگیری *</text><rect x="28" y="126" width="364" height="30" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="384" y="145" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start" direction="rtl" unicode-bidi="embed">GT-XXXX-XXXX</text><text x="392" y="159" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">شماره تماس ثبتشده *</text><rect x="28" y="166" width="364" height="30" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="384" y="185" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start" direction="rtl" unicode-bidi="embed">09xxxxxxxxx</text><rect x="16" y="232" width="388" height="38" rx="3" fill="#20242a" stroke="#20242a" stroke-width="1"/><text x="210.0" y="251" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" direction="rtl" unicode-bidi="embed">مشاهده درخواست</text><rect x="16" y="288" width="388" height="54" rx="2" fill="#fbfcfd" stroke="#c9ced4" stroke-width="1" stroke-dasharray="4 3"/><text x="395" y="303" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">BR-10 / UC-09</text><text x="395" y="317" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">کد ناموجود و شماره اشتباه هر دو یک پیام دارند:</text><text x="395" y="330" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">«درخواستی یافت نشد». وجود درخواست افشا نمی شود.</text><rect x="16" y="356" width="388" height="92" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><rect x="16" y="356" width="388" height="25" rx="2" fill="#f1f3f5" stroke="#8d959e" stroke-width="1"/><text x="395" y="373" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#20242a" text-anchor="start" direction="rtl" unicode-bidi="embed">پس از احراز</text><text x="392" y="386" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#20242a" text-anchor="start" direction="rtl" unicode-bidi="embed">قابل نمایش: وضعیت، نتیجه کارشناسی و هزینه پیشنهادی.</text><text x="392" y="406" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">غیرقابل نمایش: تاریخچه کامل، یادداشت‌های داخلی و اطلاعات کارکنان.</text><text x="392" y="426" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">مرحله بعد: جزئیات درخواست &gt; تصمیم / لغو (در صورت مجاز بودن).</text><rect x="16" y="466" width="388" height="84" rx="2" fill="#fafbfc" stroke="#c9ced4" stroke-width="1" stroke-dasharray="4 3"/><text x="395" y="481" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">حالتهای رابط کاربری</text><text x="395" y="495" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">- خالی: هر دو ورودی خالی → خطای اعتبارسنجی.</text><text x="395" y="508" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">- خطا: عدم تطابق → پیام عمومی «درخواستی یافت نشد».</text><text x="395" y="521" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">- بارگذاری: دکمه بررسی غیرفعال و اسکلتون در جزئیات.</text><text x="395" y="534" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">- موفقیت: باز شدن جزئیات درخواست (P04).</text></svg>