<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 590" width="420" height="590"><rect x="0" y="0" width="420" height="590" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><rect x="0" y="0" width="420" height="44" rx="0" fill="#f7f8fa" stroke="#c9ced4" stroke-width="1"/><line x1="0" y1="44" x2="420" y2="44" stroke="#c9ced4" stroke-width="1"/><text x="14" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#20242a" text-anchor="start">GaranTech</text><text x="92" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#59616b" text-anchor="start">/ Track Request</text><text x="406" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="end">P03</text><text x="16" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start">Both values are required. No login.</text><rect x="16" y="92" width="388" height="124" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><rect x="16" y="92" width="388" height="25" rx="2" fill="#f1f3f5" stroke="#8d959e" stroke-width="1"/><text x="25" y="109" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#20242a" text-anchor="start">Request verification</text><text x="28" y="119" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start">Tracking code *</text><rect x="28" y="126" width="364" height="30" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="36" y="145" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start">GT-XXXX-XXXX</text><text x="28" y="159" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start">Registered phone number *</text><rect x="28" y="166" width="364" height="30" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="36" y="185" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start">09xxxxxxxxx</text><rect x="16" y="232" width="388" height="38" rx="3" fill="#20242a" stroke="#20242a" stroke-width="1"/><text x="210.0" y="251" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">View Request</text><rect x="16" y="288" width="388" height="54" rx="2" fill="#fbfcfd" stroke="#c9ced4" stroke-width="1" stroke-dasharray="4 3"/><text x="25" y="303" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start">BR-10 / UC-09</text><text x="25" y="317" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">Unknown code and wrong phone use the same message:</text><text x="25" y="330" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">&#x27;Request not found&#x27;. No request existence is revealed.</text><rect x="16" y="356" width="388" height="92" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><rect x="16" y="356" width="388" height="25" rx="2" fill="#f1f3f5" stroke="#8d959e" stroke-width="1"/><text x="25" y="373" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#20242a" text-anchor="start">After verification</text><text x="28" y="386" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#20242a" text-anchor="start">Allowed: status, inspection result, proposed cost.</text><text x="28" y="406" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start">Not allowed: full history, internal notes, staff data.</text><text x="28" y="426" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start">Next: Request Details &gt; Decision / Cancel (if allowed).</text><rect x="16" y="466" width="388" height="84" rx="2" fill="#fafbfc" stroke="#c9ced4" stroke-width="1" stroke-dasharray="4 3"/><text x="25" y="481" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start">UI STATES</text><text x="25" y="495" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Empty: both inputs blank -&gt; validation error.</text><text x="25" y="508" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Error: mismatch -&gt; generic &#x27;Request not found&#x27;.</text><text x="25" y="521" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Loading: verify button disabled; skeleton on details.</text><text x="25" y="534" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Success: open Request Details (P04).</text></svg>