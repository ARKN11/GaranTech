<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 620" width="420" height="620"><rect x="0" y="0" width="420" height="620" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><rect x="0" y="0" width="420" height="44" rx="0" fill="#f7f8fa" stroke="#c9ced4" stroke-width="1"/><line x1="420" y1="44" x2="0" y2="44" stroke="#c9ced4" stroke-width="1"/><text x="406" y="28" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#20242a" text-anchor="start" direction="rtl" unicode-bidi="embed">GaranTech</text><text x="328" y="28" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">/ تصمیم مشتری</text><text x="14" y="28" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="end" direction="rtl" unicode-bidi="embed">P05</text><text x="404" y="68" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">فقط برای NOT_ELIGIBLE با پیشنهاد ثبتشده</text><rect x="16" y="92" width="388" height="132" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><rect x="16" y="92" width="388" height="25" rx="2" fill="#f1f3f5" stroke="#8d959e" stroke-width="1"/><text x="395" y="109" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#20242a" text-anchor="start" direction="rtl" unicode-bidi="embed">پیشنهاد - GT-DEMO-2048</text><text x="392" y="122" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">وضعیت گارانتی</text><text x="28" y="122" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#20242a" text-anchor="end" direction="rtl" unicode-bidi="embed">NOT_ELIGIBLE</text><text x="392" y="148" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">مبلغ کل</text><text x="28" y="148" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#20242a" text-anchor="end" direction="rtl" unicode-bidi="embed">۸٬۵۰۰٬۰۰۰ ریال</text><text x="392" y="176" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">توضیحات پیشنهاد:</text><text x="380" y="196" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#20242a" text-anchor="start" direction="rtl" unicode-bidi="embed">تعویض صفحه نمایش و عیبیابی.</text><text x="404" y="233" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">یادداشت مشتری (اختیاری)</text><rect x="16" y="240" width="388" height="56" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="396" y="258" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start" direction="rtl" unicode-bidi="embed">توضیح اختیاری</text><rect x="218" y="312" width="186" height="38" rx="3" fill="#20242a" stroke="#20242a" stroke-width="1"/><text x="311.0" y="331" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" direction="rtl" unicode-bidi="embed">پذیرش پیشنهاد</text><rect x="16" y="312" width="190" height="38" rx="3" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="111.0" y="331" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#20242a" text-anchor="middle" direction="rtl" unicode-bidi="embed">رد پیشنهاد</text><rect x="16" y="366" width="388" height="66" rx="2" fill="#fbfcfd" stroke="#c9ced4" stroke-width="1" stroke-dasharray="4 3"/><text x="395" y="381" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">تأیید / BR-05</text><text x="395" y="395" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">پیش از ثبت تأیید شود: این تصمیم نهایی است.</text><text x="395" y="408" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">پذیرش → READY_FOR_REPAIR. رد → CANCELLED.</text><text x="395" y="421" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">پس از رد، مرحله تعمیر آغاز نمی شود.</text><text x="404" y="458" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">نتیجه در جزئیات درخواست (P04) نمایش داده می شود.</text><rect x="16" y="478" width="388" height="84" rx="2" fill="#fafbfc" stroke="#c9ced4" stroke-width="1" stroke-dasharray="4 3"/><text x="395" y="493" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">حالتهای رابط کاربری</text><text x="395" y="507" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">- اعتبارسنجی: یادداشت اختیاری؛ تصمیم الزامی.</text><text x="395" y="520" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">- خطا: تغییر همزمان وضعیت → عملیات رد و رکورد تاریخچهای ایجاد نمی شود.</text><text x="395" y="533" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">- موفقیت: وضعیت و تصمیم در P04 قابل مشاهدهاند.</text><text x="395" y="546" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start" direction="rtl" unicode-bidi="embed">- بارگذاری: هر دو دکمه هنگام ثبت غیرفعالاند.</text></svg>