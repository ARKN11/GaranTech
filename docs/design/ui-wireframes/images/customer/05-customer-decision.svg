e="10" font-weight="600" fill="#59616b" text-anchor="start">Proposal notes:</text><text x="40" y="196" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#20242a" text-anchor="start">Screen replacement and diagnostics.</text><text x="16" y="233" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#59616b" text-anchor="start">Customer note (optional)</text><rect x="16" y="240" width="388" height="56" rx="2" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="24" y="258" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#9aa1aa" text-anchor="start">Optional comment</text><rect x="16" y="312" width="186" height="38" rx="3" fill="#20242a" stroke="#20242a" stroke-width="1"/><text x="109.0" y="331" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Accept Proposal</text><rect x="214" y="312" width="190" height="38" rx="3" fill="#ffffff" stroke="#8d959e" stroke-width="1"/><text x="309.0" y="331" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#20242a" text-anchor="middle">Reject Proposal</text><rect x="16" y="366" width="388" height="66" rx="2" fill="#fbfcfd" stroke="#c9ced4" stroke-width="1" stroke-dasharray="4 3"/><text x="25" y="381" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start">CONFIRMATION / BR-05</text><text x="25" y="395" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">Confirmation before submit: this decision is final.</text><text x="25" y="408" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">Accept -&gt; READY_FOR_REPAIR. Reject -&gt; CANCELLED.</text><text x="25" y="421" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">Reject does not enter repair.</text><text x="16" y="458" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#59616b" text-anchor="start">Result is shown on Request Details (P04).</text><rect x="16" y="478" width="388" height="84" rx="2" fill="#fafbfc" stroke="#c9ced4" stroke-width="1" stroke-dasharray="4 3"/><text x="25" y="493" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#59616b" text-anchor="start">UI STATES</text><text x="25" y="507" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Validation: note optional; decision required.</text><text x="25" y="520" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Error: status changed concurrently -&gt; rejected, no history row.</text><text x="25" y="533" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Success: status + decision visible on P04.</text><text x="25" y="546" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" fill="#59616b" text-anchor="start">- Loading: both buttons disabled during submit.</text></svg>